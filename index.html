<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>GTA Online Assistant</title>
    <script src="https://telegram.org/js/telegram-web-app.js?v=20260918-final"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Dancing+Script:wght@500;600&family=Oswald:wght@400;500;600&family=Roboto+Condensed:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=20260918-final">
</head>
<body>
    <div class="app">
        <header class="topbar" id="app-topbar">
            <div class="topbar-brand">
                <div class="brand">GTA ONLINE <span>ASSISTANT</span></div>
                <div class="subtitle">LOS SANTOS · SAN ANDREAS</div>
            </div>
            <div class="topbar-actions">
                <button id="theme-toggle" class="topbar-icon theme-icon" type="button" aria-label="сменить тему">☾</button>
                <button class="topbar-icon" type="button" aria-label="настройки">⚙</button>
                <button class="topbar-icon" type="button" aria-label="меню">☰</button>
            </div>
        </header>
        <main id="screen"></main>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="app.js?v=20260918-final"></script>

</html>
